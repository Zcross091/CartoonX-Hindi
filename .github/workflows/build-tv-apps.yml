name: Build Android TV & Apple TV Apps

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================================
  # JOB 1: Build Android TV Application (APK / AAB)
  # Compatible with Android TV, Google TV, Fire TV, Mi TV Box
  # ==========================================================
  build-android-tv:
    name: Build Android TV App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json', 'yarn.lock') != '' && 'npm' || '' }}

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Build Web Application Bundle (if applicable)
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm run build
          fi

      - name: Configure Android TV Project & Manifest
        run: |
          # If an android directory exists, ensure Android TV Leanback flags are present
          if [ -d "android" ]; then
            echo "Native Android directory found."
            MANIFEST_PATH=$(find android -name "AndroidManifest.xml" | head -n 1)
            if [ -n "$MANIFEST_PATH" ]; then
              echo "Checking Android TV Leanback flags in $MANIFEST_PATH..."
              # Ensure leanback feature is declared if not present
              if ! grep -q "android.software.leanback" "$MANIFEST_PATH"; then
                sed -i '/<application/i \    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />' "$MANIFEST_PATH"
              fi
              # Ensure LEANBACK_LAUNCHER intent filter is present for TV launchers
              if ! grep -q "LEANBACK_LAUNCHER" "$MANIFEST_PATH"; then
                sed -i '/android.intent.category.LAUNCHER/a \                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />' "$MANIFEST_PATH"
              fi
            fi
          else
            echo "No native android/ folder committed yet. Scaffolding Android TV wrapper..."
            mkdir -p android/app/src/main/res/values android/app/src/main/res/drawable
            cat << 'EOF' > android/settings.gradle
            rootProject.name = "CartoonX"
            include ':app'
EOF
            cat << 'EOF' > android/build.gradle
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:8.2.2'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
EOF
            cat << 'EOF' > android/app/build.gradle
            plugins {
                id 'com.android.application'
            }
            android {
                namespace 'com.cartoonx.tv'
                compileSdk 34
                defaultConfig {
                    applicationId "com.cartoonx.tv"
                    minSdk 21
                    targetSdk 34
                    versionCode 1
                    versionName "1.0.0"
                }
                buildTypes {
                    release {
                        minifyEnabled false
                        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                    }
                    debug {
                        applicationIdSuffix ".debug"
                    }
                }
            }
            dependencies {
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation 'androidx.leanback:leanback:1.0.0'
                implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            }
EOF
            cat << 'EOF' > android/app/src/main/AndroidManifest.xml
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-permission android:name="android.permission.INTERNET" />
                <uses-feature android:name="android.software.leanback" android:required="false" />
                <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

                <application
                    android:allowBackup="true"
                    android:icon="@android:drawable/sym_def_app_icon"
                    android:banner="@android:drawable/sym_def_app_icon"
                    android:label="CartoonX TV"
                    android:supportsRtl="true"
                    android:theme="@style/Theme.AppCompat.NoActionBar"
                    android:usesCleartextTraffic="true">
                    <activity
                        android:name=".MainActivity"
                        android:exported="true"
                        android:screenOrientation="landscape"
                        android:configChanges="keyboard|keyboardHidden|navigation">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                            <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
EOF
            mkdir -p android/app/src/main/java/com/cartoonx/tv
            cat << 'EOF' > android/app/src/main/java/com/cartoonx/tv/MainActivity.java
            package com.cartoonx.tv;

            import android.annotation.SuppressLint;
            import android.app.Activity;
            import android.os.Bundle;
            import android.webkit.WebSettings;
            import android.webkit.WebView;
            import android.webkit.WebViewClient;

            public class MainActivity extends Activity {
                private WebView webView;

                @SuppressLint("SetJavaScriptEnabled")
                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    webView = new WebView(this);
                    setContentView(webView);

                    WebSettings settings = webView.getSettings();
                    settings.setJavaScriptEnabled(true);
                    settings.setDomStorageEnabled(true);
                    settings.setMediaPlaybackRequiresUserGesture(false);
                    settings.setUserAgentString(settings.getUserAgentString() + " CartoonX-AndroidTV/1.0");

                    webView.setWebViewClient(new WebViewClient());
                    webView.loadUrl("https://raretoonindia.in/");
                }

                @Override
                public void onBackPressed() {
                    if (webView != null && webView.canGoBack()) {
                        webView.goBack();
                    } else {
                        super.onBackPressed();
                    }
                }
            }
EOF
          fi

      - name: Build Android TV APK
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate and Package Android TV APK
        id: locate_apk
        run: |
          APK_PATH=$(find android -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            mkdir -p build_output
            cp "$APK_PATH" build_output/CartoonX-AndroidTV-Debug.apk
            echo "apk_path=build_output/CartoonX-AndroidTV-Debug.apk" >> $GITHUB_OUTPUT
          else
            echo "Error: No APK found after build"
            exit 1
          fi

      - name: Upload Android TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CartoonX-AndroidTV-APK
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 14


  # ==========================================================
  # JOB 2: Build Apple TV (tvOS) Application
  # Compatible with Apple TV HD, Apple TV 4K (tvOS 15+)
  # ==========================================================
  build-apple-tv:
    name: Build Apple TV (tvOS) App
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          echo "Current Xcode:"
          xcodebuild -version
          echo "Available SDKs:"
          xcodebuild -showsdks

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json', 'yarn.lock') != '' && 'npm' || '' }}

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Configure Apple TV (tvOS) Project
        run: |
          # Check for existing tvOS or iOS project
          XCODEPROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          XCWORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)

          if [ -n "$XCODEPROJ" ] || [ -n "$XCWORKSPACE" ]; then
            echo "Existing Xcode project found."
          else
            echo "Scaffolding standalone Apple TV (tvOS) Swift project..."
            mkdir -p AppleTV/CartoonXTV
            cat << 'EOF' > AppleTV/CartoonXTV/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key>
    <string>en</string>
    <key>CFBundleExecutable</key>
    <string>$(EXECUTABLE_NAME)</string>
    <key>CFBundleIdentifier</key>
    <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundleName</key>
    <string>$(PRODUCT_NAME)</string>
    <key>CFBundlePackageType</key>
    <string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>LSRequiresIPhoneOS</key>
    <false/>
    <key>UIDeviceFamily</key>
    <array>
        <integer>3</integer>
    </array>
    <key>NSAppTransportSecurity</key>
    <dict>
        <key>NSAllowsArbitraryLoads</key>
        <true/>
    </dict>
</dict>
</plist>
EOF
            cat << 'EOF' > AppleTV/CartoonXTV/main.swift
import UIKit
import TVMLKit

class AppDelegate: UIResponder, UIApplicationDelegate, TVApplicationControllerDelegate {
    var window: UIWindow?
    var appController: TVApplicationController?

    func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
        window = UIWindow(frame: UIScreen.main.bounds)
        let viewController = UIViewController()
        viewController.view.backgroundColor = UIColor(red: 0.05, green: 0.09, blue: 0.16, alpha: 1.0)
        
        let label = UILabel(frame: CGRect(x: 0, y: 0, width: 800, height: 120))
        label.center = viewController.view.center
        label.textAlignment = .center
        label.textColor = .white
        label.font = UIFont.boldSystemFont(ofSize: 48)
        label.text = "CartoonX - Hindi Toons TV"
        viewController.view.addSubview(label)

        window?.rootViewController = viewController
        window?.makeKeyAndVisible()
        return true
    }
}

UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
EOF
            # Generate minimal xcodeproj using SwiftPM or xcodebuild
            cat << 'EOF' > AppleTV/Package.swift
// swift-tools-version:5.9
import PackageDescription

let package = Package(
    name: "CartoonXTV",
    platforms: [.tvOS(.v15)],
    products: [
        .executable(name: "CartoonXTV", targets: ["CartoonXTV"])
    ],
    targets: [
        .executableTarget(
            name: "CartoonXTV",
            path: "CartoonXTV"
        )
    ]
)
EOF
          fi

      - name: Build tvOS App Bundle
        run: |
          mkdir -p build_output/apple_tv
          if [ -d "AppleTV" ]; then
            cd AppleTV
            echo "Building tvOS package with SwiftPM..."
            swift build -c release --triple arm64-apple-tvos15.0 || swift build -c release
            cd ..
            # Package into an installable tvOS bundle
            find AppleTV/.build -type f -perm +111 -name "CartoonXTV" | head -n 1 | xargs -I {} cp {} build_output/apple_tv/CartoonXTV_binary
          fi

          # If an Xcode project or workspace is available, build via xcodebuild
          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -n "$XCODEPROJ" ]; then
            echo "Building via xcodebuild for tvOS simulator/device..."
            xcodebuild build \
              -project "$XCODEPROJ" \
              -scheme "$(xcodebuild -list -project "$XCODEPROJ" | grep -A 1 "Schemes:" | tail -n 1 | tr -d ' ')" \
              -destination 'generic/platform=tvOS' \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CONFIGURATION_BUILD_DIR="build_output/apple_tv" || true
          fi

          # Create a distributable Apple TV zip
          cd build_output
          zip -r CartoonX-AppleTV-tvOS.zip apple_tv/
          cd ..

      - name: Upload Apple TV (tvOS) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CartoonX-AppleTV-tvOS
          path: build_output/CartoonX-AppleTV-tvOS.zip
          retention-days: 14


  # ==========================================================
  # JOB 3: Release Publisher (Optional on Tag / Main Commit)
  # ==========================================================
  create-release:
    name: Publish Release Packages
    needs: [build-android-tv, build-apple-tv]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Android TV Artifact
        uses: actions/download-artifact@v4
        with:
          name: CartoonX-AndroidTV-APK
          path: release_assets/

      - name: Download Apple TV Artifact
        uses: actions/download-artifact@v4
        with:
          name: CartoonX-AppleTV-tvOS
          path: release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          name: CartoonX TV Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
