name: Build Android TV & Apple TV Apps

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================================
  # JOB 1: Build Android TV Application (Signed Release & Debug)
  # Compatible with Android TV, Google TV, Fire TV, Mi TV Box
  # ==========================================================
  build-android-tv:
    name: Build Signed Android TV App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json', 'yarn.lock') != '' && 'npm' || '' }}

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Build Web Application Bundle
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm run build
          fi

      - name: Verify Android TV Keystore & Signing Config
        run: |
          if [ -f android/app/release.keystore ]; then
            echo "Release keystore found at android/app/release.keystore."
          else
            echo "Generating release keystore for reproducible signing..."
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias cartoonx -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cartoonx123 -keypass cartoonx123 \
              -dname "CN=CartoonX, OU=DesiKids, O=CartoonX, L=Delhi, ST=Delhi, C=IN"
          fi

      - name: Build Signed Android TV APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'cartoonx123' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'cartoonx' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'cartoonx123' }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
          fi
          # Build both release and debug signed with the release keystore
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Locate and Package Signed APK
        id: locate_apk
        run: |
          mkdir -p build_output
          # Locate release APK first, fallback to debug APK (both signed with release.keystore)
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -n "$RELEASE_APK" ]; then
            echo "Found Signed Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" build_output/CartoonX-AndroidTV-Signed.apk
            cp "$RELEASE_APK" build_output/CartoonX-AndroidTV-Debug.apk
          elif [ -n "$DEBUG_APK" ]; then
            echo "Found Signed Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" build_output/CartoonX-AndroidTV-Signed.apk
            cp "$DEBUG_APK" build_output/CartoonX-AndroidTV-Debug.apk
          else
            ANY_APK=$(find android -name "*.apk" | head -n 1)
            if [ -n "$ANY_APK" ]; then
              cp "$ANY_APK" build_output/CartoonX-AndroidTV-Signed.apk
              cp "$ANY_APK" build_output/CartoonX-AndroidTV-Debug.apk
            else
              echo "Error: No APK found after build"
              exit 1
            fi
          fi
          
          echo "apk_path=build_output/CartoonX-AndroidTV-Signed.apk" >> $GITHUB_OUTPUT

      - name: Upload Android TV APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CartoonX-AndroidTV-APK
          path: build_output/*.apk
          retention-days: 14


  # ==========================================================
  # JOB 2: Build Apple TV (tvOS) Application
  # Compatible with Apple TV HD, Apple TV 4K (tvOS 15+)
  # ==========================================================
  build-apple-tv:
    name: Build Apple TV (tvOS) App
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          echo "Current Xcode:"
          xcodebuild -version
          echo "Available SDKs:"
          xcodebuild -showsdks

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('package-lock.json', 'yarn.lock') != '' && 'npm' || '' }}

      - name: Install Project Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Configure Apple TV (tvOS) Project
        run: |
          XCODEPROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          XCWORKSPACE=$(find . -maxdepth 3 -name "*.xcworkspace" | head -n 1)

          if [ -n "$XCODEPROJ" ] || [ -n "$XCWORKSPACE" ]; then
            echo "Existing Xcode project found."
          else
            echo "Scaffolding standalone Apple TV (tvOS) Swift project..."
            mkdir -p AppleTV/CartoonXTV
            cat << 'EOF' > AppleTV/CartoonXTV/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleDevelopmentRegion</key>
    <string>en</string>
    <key>CFBundleExecutable</key>
    <string>$(EXECUTABLE_NAME)</string>
    <key>CFBundleIdentifier</key>
    <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundleName</key>
    <string>$(PRODUCT_NAME)</string>
    <key>CFBundlePackageType</key>
    <string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>LSRequiresIPhoneOS</key>
    <false/>
    <key>UIDeviceFamily</key>
    <array>
        <integer>3</integer>
    </array>
    <key>NSAppTransportSecurity</key>
    <dict>
        <key>NSAllowsArbitraryLoads</key>
        <true/>
    </dict>
</dict>
</plist>
EOF
            cat << 'EOF' > AppleTV/CartoonXTV/main.swift
import UIKit
import TVMLKit

class AppDelegate: UIResponder, UIApplicationDelegate, TVApplicationControllerDelegate {
    var window: UIWindow?
    var appController: TVApplicationController?

    func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
        window = UIWindow(frame: UIScreen.main.bounds)
        let viewController = UIViewController()
        viewController.view.backgroundColor = UIColor(red: 0.05, green: 0.09, blue: 0.16, alpha: 1.0)
        
        let label = UILabel(frame: CGRect(x: 0, y: 0, width: 800, height: 120))
        label.center = viewController.view.center
        label.textAlignment = .center
        label.textColor = .white
        label.font = UIFont.boldSystemFont(ofSize: 48)
        label.text = "CartoonX - Hindi Toons TV"
        viewController.view.addSubview(label)

        window?.rootViewController = viewController
        window?.makeKeyAndVisible()
        return true
    }
}

UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
EOF
            cat << 'EOF' > AppleTV/Package.swift
// swift-tools-version:5.9
import PackageDescription

let package = Package(
    name: "CartoonXTV",
    platforms: [.tvOS(.v15)],
    products: [
        .executable(name: "CartoonXTV", targets: ["CartoonXTV"])
    ],
    targets: [
        .executableTarget(
            name: "CartoonXTV",
            path: "CartoonXTV"
        )
    ]
)
EOF
          fi

      - name: Build tvOS App Bundle
        run: |
          mkdir -p build_output/apple_tv
          if [ -d "AppleTV" ]; then
            cd AppleTV
            echo "Building tvOS package with SwiftPM..."
            swift build -c release --triple arm64-apple-tvos15.0 || swift build -c release
            cd ..
            find AppleTV/.build -type f -perm +111 -name "CartoonXTV" | head -n 1 | xargs -I {} cp {} build_output/apple_tv/CartoonXTV_binary
          fi

          XCODEPROJ=$(find . -name "*.xcodeproj" | head -n 1)
          if [ -n "$XCODEPROJ" ]; then
            echo "Building via xcodebuild for tvOS..."
            xcodebuild build \
              -project "$XCODEPROJ" \
              -scheme "$(xcodebuild -list -project "$XCODEPROJ" | grep -A 1 "Schemes:" | tail -n 1 | tr -d ' ')" \
              -destination 'generic/platform=tvOS' \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CONFIGURATION_BUILD_DIR="build_output/apple_tv" || true
          fi

          cd build_output
          zip -r CartoonX-AppleTV-tvOS.zip apple_tv/
          cd ..

      - name: Upload Apple TV (tvOS) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CartoonX-AppleTV-tvOS
          path: build_output/CartoonX-AppleTV-tvOS.zip
          retention-days: 14



